<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Sampler & Sequencer</title>

    <!-- APK:OS's sound watchdog. When the APK:OS desktop frames this page on its
         sound site it pings it every second and replaces it when it stops
         answering, and this is what answers — and lends the bus hooks the
         shell's broker, so a replaced Sampler comes back with its kit. Framed
         by nothing, or served where APK:OS is not beside it, it does nothing
         (and a 404 here is silent). Ahead of the bundle on purpose: it has to
         be listening before the shell says hello. PLAN-3315.01. -->
    <script src="../../../APK:OS/Midi/site/agent/sound-agent.js"></script>

    <!-- React & ReactDOM -->
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    

    <!-- Progressive Web App Settings -->
    <link rel="manifest" href="./manifest.json">
    <!-- The brand and state tokens (contracts/generated/web, vendored by
         .apk.scripts/vendor_contract_web.py and held to it by check.sh webtokens):
         --accent below is --apk-accent, never spelled here. -->
    <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
    <!-- THE ONE TABLE (FrontEnd/shared/apk-table.*, vendored; check.sh webshared) -->
    <link rel="stylesheet" href="./vendor/apk-table/apk-table.css">
    <style>
      .seq-swing-table table.apk-table { font-size: 10px; color: #ccc; }
      .seq-swing-table .apk-table-scroll { border: 0; }
      .seq-swing-table tr.seq-swing-on { background: color-mix(in srgb, var(--accent) 15%, transparent); }
      .seq-swing-table td.seq-swing-pct { font-weight: bold; }
    </style>
    <!-- The OS reads this meta, not the page's CSS, so it is filled from the token
         as soon as the stylesheet above has applied (a script waits for it). -->
    <meta name="theme-color" content="">
    <script>
        document.querySelector('meta[name="theme-color"]').setAttribute('content',
            getComputedStyle(document.documentElement).getPropertyValue('--apk-accent').trim());
    </script>
    <link rel="icon" href="./ICON and LOGO/favicon.ico">
    <link rel="apple-touch-icon" href="./ICON and LOGO/icon-192.png">
    <link rel="apple-touch-startup-image" href="./ICON and LOGO/splash.png">

    <style>
        body {
            background-color: var(--bg, #1b1d22);
            color: var(--text, #d7dce3);
            font-family: "Segoe UI", system-ui, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        #root {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* This is an instrument, not a document. On a phone a press-and-hold on
           a pad, a step or a knob's label raised the selection loupe and the
           Copy/Share bar instead of playing the sound — and a drag that started
           on a label selected a paragraph of the UI. Nothing here is text you
           are meant to select, so selection is off everywhere and switched back
           on only for the fields you type into. Add class="selectable" to
           anything that should be copyable. */
        body {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        input, textarea, select, [contenteditable], .selectable {
            -webkit-user-select: text;
            user-select: text;
            -webkit-touch-callout: default;
        }

        /* Variables extracted from user's mixer */
        :root {
            --bg: #1b1c1e;
            --panel: #242528;
            --strip: #2b2b2e;
            /* The one colour the whole app is keyed to. Config's theme picker
               rewrites this on :root at runtime; everything below is derived
               from it, so one property changes the entire page. Deliberately
               NOT persisted — the app comes back up orange on every load. */
            --accent: var(--apk-accent);
            --accent-rgb: var(--apk-accent-rgb);   /* the same colour, for rgba() glows */
            --text: #e8e8e8;
            --muted: #888a8d;
            --on: var(--accent);
            --solo: var(--accent-t40);

            /* Tints toward white and shades toward black, so a family of
               related colours follows whatever hue is picked instead of a
               fixed row of oranges going out of tune with it. */
            --accent-t15: color-mix(in srgb, var(--accent) 85%, #fff);
            --accent-t25: color-mix(in srgb, var(--accent) 75%, #fff);
            --accent-t40: color-mix(in srgb, var(--accent) 60%, #fff);
            --accent-t60: color-mix(in srgb, var(--accent) 40%, #fff);
            --accent-s15: color-mix(in srgb, var(--accent) 85%, #000);
            --accent-s25: color-mix(in srgb, var(--accent) 75%, #000);
            --accent-s40: color-mix(in srgb, var(--accent) 60%, #000);
            --accent-s55: color-mix(in srgb, var(--accent) 45%, #000);
            --accent-s70: color-mix(in srgb, var(--accent) 30%, #000);
            --accent-s80: color-mix(in srgb, var(--accent) 20%, #000);
            --accent-s85: color-mix(in srgb, var(--accent) 15%, #000);
            /* Translucent washes for glows and hover fills. */
            --accent-a10: color-mix(in srgb, var(--accent) 10%, transparent);
            --accent-a25: color-mix(in srgb, var(--accent) 25%, transparent);
            --accent-a50: color-mix(in srgb, var(--accent) 50%, transparent);
            /* Text that sits ON the accent — near-black reads on every hue the
               picker can produce, which a white label would not. */
            --on-accent: #111;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .flex-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .chunky-scrollbar::-webkit-scrollbar {
            height: 56px;
        }
        .chunky-scrollbar::-webkit-scrollbar-track {
            background-color: #1a1c1e;
            border: 2px solid #000;
            border-radius: 6px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
            margin: 4px;
        }
        .chunky-scrollbar::-webkit-scrollbar-thumb {
            background-color: var(--accent);
            border: 2px solid #000;
            border-radius: 4px;
            box-shadow: inset 0 2px 2px rgba(255,255,255,0.3), inset 0 -2px 2px rgba(0,0,0,0.3);
            background-image: linear-gradient(90deg, 
                transparent 40%, rgba(0,0,0,0.8) 40%, rgba(0,0,0,0.8) 60%, transparent 60%
            );
            cursor: pointer;
        }
        .chunky-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: var(--accent-t60);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Mount App -->
    <!-- Everything: the sources in sources.json, compiled ahead of time by build.mjs -->
    <!-- The SDK (vendored; check.sh webtokens / webshared): ? help (F1), and a failure
         (MIDI refused, a file that will not decode, a blocked pop-out) says what happened / why / do this. -->
    <script src="./vendor/apk-contracts/apk-contracts.global.js"></script>
    <script src="./vendor/apk-softapp/apk-softapp.js"></script>
    <script>
        if (window.APKSoftapp) window.APKSoftapp.describe({
            name: 'Sampler.Like.Audio',
            does: 'A drum sampler and 16-step sequencer in the browser: sixteen velocity pads, chop and pitch, a song arranger, a channel-strip mixer with effects, and a sound browser.',
            inputs: [
                { name: 'Samples', from: 'the bundled SampleLibrary, a folder you choose in the sound browser, or an audio file dropped on the page', kind: 'audio' },
                { name: '.PEAK sidecar', from: 'dropped with the audio (else the Sampler scans the file itself)' },
                { name: 'Microphone / line', from: 'the sound browser recorder (asks permission)', kind: 'audio' },
                { name: 'MIDI keyboard / pads', from: 'Web MIDI inputs (asks permission); notes play pads, the wheel bends pitch', kind: 'midi' },
                { name: 'Song file', from: '⭱ Import in the song arranger' },
                { name: 'Strip EQ trims', from: 'bus', kind: 'bus', topic: 'APK.audio/Gui/DrumKit/<pad>/eq/<band>' },
                { name: 'Kits, favourites, patterns', from: 'bus shared state (Gui/DrumSets, Gui/SoundFavorites, Gui/Sequencer/<label>/pattern)', kind: 'bus' },
            ],
            outputs: [
                { name: 'Audio', to: "the browser's audio output, through the mixer and master buss", kind: 'audio' },
                { name: 'Pad assignments', to: 'bus (retained)', kind: 'bus', topic: 'APK.audio/Gui/DrumKit/<pad>/sample' },
                { name: 'Song', to: '⭳ Export: a song file download' },
                { name: 'Stems', to: 'render stems: a .zip of one WAV per track' },
                { name: 'Recorded takes', to: 'the sound browser recorder: save a take' },
            ],
            controls: [
                { name: 'Pads', how: 'click / touch, or MIDI notes; velocity from the hit' },
                { name: 'Tabs', how: 'PADS, EDITOR, MIXER: two open at once' },
                { name: 'Sequencer and song', how: 'the step grid, BPM, steps, swing; the arranger with ⭳ Export / ⭱ Import' },
                { name: 'Mixer and effects', how: 'per-channel faders, mutes, solos; EQ, gate, compressor, drive, chorus, delay, reverb faceplates; pop a panel out to its own window' },
                { name: 'Deep links', how: 'index.html#/<view> opens one faceplate (e.g. #/compressor)' },
            ],
            problems: ['file_unreadable', 'bad_json', 'bad_input', 'permission_denied', 'device_busy', 'unsupported_browser'],
        });
    </script>
    <script src="./vendor/apk-table/apk-table.js"></script>
    <script src="./dist/app.js"></script>
</body>
</html>
